<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Rubik:wght@500;700&display=swap"><link rel="stylesheet" href="/assets/site.css"><title>Entrar na Fazenda dos Sonhos</title><meta name="robots" content="noindex"></head><body class="authbg">
<header class="top solid"><div class="wrap"><a class="logo" href="/">Fazenda dos Sonhos</a><nav><a class="btn green" href="/jogar/">Jogar</a></nav></div></header>
<main class="wrap"><div class="card" id="box"></div></main>
<script>
const box=document.getElementById('box'),back=(()=>{const v=new URLSearchParams(location.search).get('volta')||'/jogar/';return v.startsWith('/')&&!v.startsWith('//')?v:'/jogar/'})();let mode='login',busy=false;
const tabs=()=>'<div class="tabs" role="tablist"><button id="t-login" class="'+(mode=='login'?'on':'')+'">Entrar</button><button id="t-new" class="'+(mode=='new'?'on':'')+'">Criar conta</button></div>';
function render(){if(mode=='login')box.innerHTML=tabs()+'<form id="fm"><label class="f" for="em">E-mail<input id="em" type="email" autocomplete="email" required></label><label class="f" for="pw">Senha<input id="pw" type="password" autocomplete="current-password" required></label><p class="err" id="err" role="alert"></p><button class="btn green w100" type="submit">Entrar</button></form><p class="small" style="margin-bottom:0"><button class="link" id="t-reset">Esqueci minha senha</button></p>';
 if(mode=='new')box.innerHTML=tabs()+'<form id="fm"><label class="f" for="em">E-mail<input id="em" type="email" autocomplete="email" required></label><label class="f" for="pw">Senha, com pelo menos 8 caracteres<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label><label class="check" for="tm"><input id="tm" type="checkbox" required><span>Li e aceito os <a href="/termos/" target="_blank">termos de uso</a> e a <a href="/privacidade/" target="_blank">política de privacidade</a>. Se tenho menos de 18 anos, tenho autorização do meu responsável.</span></label><p class="err" id="err" role="alert"></p><button class="btn green w100" type="submit">Criar conta</button></form>';
 if(mode=='reset')box.innerHTML='<h1 style="font-size:28px;margin-bottom:6px">Trocar senha</h1><p class="small">Use o código de recuperação que você guardou ao criar a conta.</p><form id="fm"><label class="f" for="em">E-mail<input id="em" type="email" autocomplete="email" required></label><label class="f" for="cd">Código de recuperação<input id="cd" autocomplete="off" required></label><label class="f" for="pw">Nova senha<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label><p class="err" id="err" role="alert"></p><button class="btn green w100" type="submit">Trocar senha</button></form><p class="small" style="margin-bottom:0"><button class="link" id="t-login">Voltar para entrar</button></p>';
 for(const[id,m]of[['t-login','login'],['t-new','new'],['t-reset','reset']]){const e=document.getElementById(id);if(e)e.onclick=()=>{mode=m;render()}}
 const fm=document.getElementById('fm');fm.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=fm.querySelector('[type=submit]'),err=document.getElementById('err');b.disabled=true;err.textContent='';
  const v=id=>{const x=document.getElementById(id);return x?x.value:''},path={login:'login',new:'register',reset:'reset'}[mode],body={email:v('em'),password:v('pw'),code:v('cd'),terms:(document.getElementById('tm')||{}).checked};
  try{const r=await fetch('/api/auth/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok){err.textContent=j.error||'Não foi possível continuar.';b.disabled=false;busy=false;return}if(j.recovery)showCode(j.recovery);else location.href=back}catch(x){err.textContent='Sem conexão. Tente de novo.';b.disabled=false;busy=false}}}
function showCode(c){box.innerHTML='<h1 style="font-size:28px;margin-bottom:6px">Guarde este código</h1><p>Ele é a única forma de trocar a senha se você a esquecer. Ele não será mostrado de novo.</p><div class="code" id="code">'+c+'</div><button class="btn plain w100" id="cp" style="margin-bottom:12px">Copiar código</button><label class="check" for="ok"><input id="ok" type="checkbox"><span>Guardei meu código em um lugar seguro.</span></label><button class="btn green w100" id="go" disabled>Continuar para a fazenda</button>';
 document.getElementById('cp').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(c).then(()=>e.target.textContent='Copiado').catch(()=>{})};document.getElementById('ok').onchange=e=>document.getElementById('go').disabled=!e.target.checked;document.getElementById('go').onclick=()=>location.href=back}
render();fetch('/api/auth/me').then(r=>r.json()).then(j=>{if(j.user&&mode=='login'&&!document.getElementById('em').value)location.href=back}).catch(()=>{});
</script></body></html>
