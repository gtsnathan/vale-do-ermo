<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Fazenda dos Sonhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@500;700&display=swap">
<style>
/* Conceito: uma ilha de fazenda flutuando no céu, operada com um polegar. Painéis de papel com borda de pixel. */
:root{
  color-scheme:light;
  --ink:#2b2350; --ink2:#5b5085; --paper:#fff4d6; --paper2:#f6e2b3; --line:#d9bd83;
  --gold:#ffb627; --gold2:#d9860f; --leaf:#4f9e3d; --leaf2:#2f7429; --coral:#e8503f; --sky:#7ba7ee; --gem:#37c6d0;
  --display:"Nunito","Trebuchet MS",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#7ba7ee;overscroll-behavior:none}
body{font:500 14px/1.3 var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
img.px{image-rendering:pixelated;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:1px}
.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #fffbea,0 3px 0 rgba(43,35,80,.45)}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:0 12px;background:var(--gold);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--gold2),inset 0 2px 0 #ffe08a;font:800 15px var(--display);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--gold2)}
.btn.green{background:#79cf5b;box-shadow:inset 0 -4px 0 var(--leaf),inset 0 2px 0 #b6f09d}
.btn.plain{background:var(--paper2);box-shadow:inset 0 -4px 0 var(--line),inset 0 2px 0 #fffbea}
.btn.red{background:#f47e6f;box-shadow:inset 0 -4px 0 var(--coral),inset 0 2px 0 #ffc0b6}
.btn[disabled]{filter:grayscale(.85);opacity:.55;cursor:default}
.btn img{width:16px;height:16px}

/* Barra superior */
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;align-items:stretch;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#who{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:3px 7px 3px 3px;text-align:left}
#who .av{width:36px;height:36px;background:#bfe3ff;border:2px solid var(--ink);flex:none;overflow:hidden}
#who .av img{width:36px;height:36px}
#who .inf{flex:1;min-width:0}
#fname{font:800 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#xpw{position:relative;height:13px;background:#d8c7ee;border:2px solid var(--ink);margin-top:2px}
#xpb{height:100%;background:linear-gradient(#9fe37f 50%,#67bf4b 50%);width:0;transition:width .35s steps(8)}
#xpt{position:absolute;inset:-2px 0 0;font:800 10px/13px var(--display);text-align:center}
#lv{position:absolute;left:0;bottom:-3px;width:18px;height:18px;background:var(--gold);border:2px solid var(--ink);font:800 11px/14px var(--display);text-align:center}
.mon{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:2px 7px;font:800 15px var(--display);font-variant-numeric:tabular-nums}
.mon div{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.mon img{width:14px;height:14px}
#gear{width:42px;display:grid;place-items:center}
#gear img{width:24px;height:24px}
#tip{position:absolute;top:60px;left:6px;max-width:min(86%,340px);z-index:4;display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:12.5px;text-align:left;background:rgba(255,244,214,.94)}
#tip img{width:16px;height:16px;flex:none}
#tip.claim{background:var(--gold);animation:nudge 1s steps(2) infinite}
@keyframes nudge{50%{transform:translateY(-2px)}}

/* Menu inferior */
#dock{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:var(--ink);padding:4px 3px;gap:2px;z-index:6}
#dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 2px;color:var(--paper);font:800 11px var(--display);min-width:0}
#dock button.on{background:#4a3f7d;box-shadow:inset 0 -3px 0 var(--gold)}
#dock img{width:26px;height:26px}
.dot{position:absolute;top:2px;right:18%;width:9px;height:9px;background:var(--coral);border:2px solid var(--paper)}

/* Bandeja de ferramentas, sempre ao alcance do polegar */
#tray{position:absolute;left:0;right:0;bottom:62px;z-index:5;padding:5px 6px;background:rgba(43,35,80,.92)}
#trayhead{display:flex;align-items:center;justify-content:space-between;color:var(--paper);font-size:12.5px;padding:0 2px 4px;gap:8px}
#trayhead .btn{min-height:30px;padding:0 10px;font-size:13px}
#chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;width:60px;padding:4px 2px 3px;background:var(--paper);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;font:800 11.5px/1.1 var(--display)}
.chip img{width:28px;height:28px}
.chip small{font:500 10px var(--body);color:var(--ink2)}
.chip.on{background:var(--gold);outline:2px solid #fff}
.chip.off{opacity:.5}

/* Cartão de seleção */
#card{position:absolute;left:6px;right:6px;bottom:68px;z-index:5;padding:8px 10px;max-height:52%;overflow:auto;max-width:520px;margin:auto}
#card h3{margin:0;font:800 17px var(--display);display:flex;gap:6px;align-items:center}
#card h3 img{width:26px;height:26px}
#card h3 .x{margin-left:auto;font:800 18px var(--display);width:32px;height:32px}
#card p{margin:3px 0 6px;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:10px;border:2px solid var(--ink);background:#e6d7b0;margin:3px 0 6px}
.bar i{display:block;height:100%;background:var(--leaf)}
.q{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.q span{position:relative;width:34px;height:34px;background:var(--paper2);border:2px solid var(--ink);display:grid;place-items:center;font:800 10px var(--display)}
.q span.done{background:#b6f09d}
.q img{width:22px;height:22px}
.q em{position:absolute;bottom:-1px;right:1px;font-style:normal}
.rec{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:2px dotted var(--line)}
.rec .io{flex:1;min-width:0;display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12.5px}
.rec img{width:22px;height:22px}

/* Painel deslizante */
#sheetw{position:absolute;inset:0;z-index:8;background:rgba(43,35,80,.42);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:560px;max-height:82%;display:flex;flex-direction:column;border-bottom:0;animation:rise .18s steps(4)}
@keyframes rise{from{transform:translateY(40px)}}
#sheet header{display:flex;align-items:center;padding:8px 10px 4px;gap:8px}
#sheet h2{margin:0;font:800 22px var(--display);flex:1;text-wrap:balance}
#sheet header button{font:800 20px var(--display);width:40px;height:40px;background:var(--paper2);border:3px solid var(--ink)}
#tabs{display:flex;gap:4px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
#tabs button{flex:none;padding:6px 10px;background:var(--paper2);border:2px solid var(--ink);font:800 14px var(--display)}
#tabs button.on{background:var(--ink);color:var(--paper)}
#body{overflow:auto;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dotted var(--line)}
.row>img{width:36px;height:36px;flex:none}
.row .t{flex:1;min-width:0}
.row b{font:800 15.5px/1.15 var(--display);display:block}
.row small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.25;font-variant-numeric:tabular-nums}
.row .side{display:flex;gap:4px;flex:none}
.row.off{opacity:.55}
.row .btn{min-height:38px;padding:0 9px;font-size:14px}
.h{font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin-top:6px}
.cell{background:var(--paper2);border:2px solid var(--ink);padding:4px 2px;display:flex;flex-direction:column;align-items:center;font:800 11px/1.1 var(--display);text-align:center}
.cell img{width:32px;height:32px}
.cell b{font-size:14px}
.cap{height:14px;border:2px solid var(--ink);background:#e6d7b0;margin:4px 0 2px}
.cap i{display:block;height:100%;background:var(--gold)}
.npc{width:44px;height:44px;background:#bfe3ff;border:2px solid var(--ink);flex:none}
.need{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.need span{display:inline-flex;align-items:center;gap:2px;font:800 13px var(--display)}
.need span.no{color:var(--coral)}
.need img{width:18px;height:18px}
.field{display:block;margin:8px 0;font:800 13px var(--display)}
.field input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:8px;font:500 16px var(--body);background:#fffbea;border:3px solid var(--ink);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{height:70px;font-size:12px}
.opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.opts button{min-width:38px;min-height:38px;padding:0 8px;background:var(--paper2);border:3px solid var(--ink);font:500 13.5px var(--body)}
.opts button.on{outline:3px solid var(--coral);outline-offset:-1px;background:#fff}
#prev{width:96px;height:96px;background:#bfe3ff;border:3px solid var(--ink);float:right;margin:0 0 6px 8px}
#mini{display:block;width:100%;max-width:280px;margin:4px auto;image-rendering:pixelated}

#place{position:absolute;left:0;right:0;bottom:62px;z-index:6;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:rgba(43,35,80,.92);color:var(--paper)}
#place .msg{flex-basis:100%;text-align:center;font-size:13px}

#toasts{position:absolute;top:96px;left:0;right:0;z-index:9;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{padding:5px 10px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);font-size:13px;max-width:88%;text-align:center;animation:rise .15s steps(3)}
#lvl{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(43,35,80,.35)}
#lvl>div{padding:16px 20px;text-align:center;max-width:300px;animation:pop .45s steps(6)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}}
#lvl h2{margin:0;font:800 34px var(--display);color:var(--gold2)}
#lvl p{margin:5px 0 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){#dock{left:50%;right:auto;width:560px;transform:translateX(-50%)}#tray,#place{left:50%;right:auto;width:560px;transform:translateX(-50%);box-sizing:border-box}}
/* ---- acabamento: cantos de pixel, relevo e profundidade ---- */
:root{--notch:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.panel,.btn,.chip,.cell,#tabs button,#sheet header button,.opts button{clip-path:var(--notch)}
.panel{background:var(--paper) linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 40%);box-shadow:inset 0 0 0 2px #fffbea,inset 0 -5px 0 rgba(217,189,131,.55)}
a.btn{text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline-offset:-5px}
#who .av{position:relative;overflow:visible}
#who .av img{clip-path:inset(0)}
#lv{left:auto;right:-5px;bottom:-5px;width:auto;min-width:18px;padding:0 1px;box-sizing:border-box;box-shadow:inset 0 -2px 0 var(--gold2)}
#who{padding-right:9px}
#who .inf{padding-left:5px}
#xpw{height:14px;background:#463b73}
#xpb{background:linear-gradient(#b5ee87 35%,#6ccb49 35%,#4fae38)}
#xpt{color:#fff;text-shadow:1px 1px 0 var(--ink);inset:-1px 0 0}
.mon{background:var(--ink);color:#fff6d6;box-shadow:inset 0 0 0 2px #4a3f7d}
#tip{background:rgba(43,35,80,.9);color:#fff6d6;box-shadow:none;border-color:var(--ink)}
#tip.claim{background:var(--gold);color:var(--ink)}
#dock{background:linear-gradient(#524589,#2b2350 60%);box-shadow:0 -3px 0 var(--ink),inset 0 2px 0 #7d6fb8;padding-top:5px;overflow:visible}
#dock button{transition:transform .08s steps(2)}
#dock button:active{transform:translateY(2px)}
#dock img{filter:drop-shadow(0 2px 0 rgba(20,14,50,.65))}
#dock button.on{background:none;box-shadow:none;color:var(--gold);transform:translateY(-5px)}
#dock button.on img{filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 3px 0 var(--gold2));width:30px;height:30px;margin-top:-4px}
#tray,#place{background:linear-gradient(rgba(82,69,137,.96),rgba(43,35,80,.96));box-shadow:0 -3px 0 var(--ink),inset 0 2px 0 #7d6fb8}
.chip{box-shadow:inset 0 -4px 0 var(--paper2),inset 0 2px 0 #fff}
.chip.on{outline:0;background:var(--gold);box-shadow:inset 0 -4px 0 var(--gold2),inset 0 2px 0 #ffe08a;transform:translateY(-2px)}
#sheetw{background:linear-gradient(rgba(43,35,80,.2),rgba(43,35,80,.68))}
#sheet{box-shadow:inset 0 0 0 2px #fffbea}
#sheet header{margin:2px 2px 8px;padding:6px 8px;background:linear-gradient(#ffc848 50%,#f8ae25 50%);border-bottom:3px solid var(--ink)}
#sheet h2{text-shadow:0 2px 0 rgba(255,255,255,.45)}
#sheet header button{width:36px;height:36px;background:var(--paper)}
#tabs button{background:var(--paper2);box-shadow:inset 0 -3px 0 var(--line)}
#tabs button.on{background:var(--ink);box-shadow:inset 0 2px 0 #6e5fa8}
.row>img{filter:drop-shadow(0 2px 0 rgba(43,35,80,.25))}
.row{border-bottom-style:solid;border-bottom-color:rgba(217,189,131,.55)}
.cell{box-shadow:inset 0 -3px 0 var(--line)}
#card{box-shadow:inset 0 0 0 2px #fffbea}
.toast{background:rgba(43,35,80,.96);clip-path:var(--notch);font-weight:700}
#lvl h2{text-shadow:0 3px 0 #ffe08a}
#tabs button{padding:6px 8px;font-size:13px}
#dock button{font-size:11.5px;letter-spacing:-.01em}
.chip{font-size:12px}.row small{font-size:13px}
#sheet h2{font-weight:900;letter-spacing:-.01em}.row b{font-size:16px}
#fishbar{position:relative;height:30px;margin:8px 0;background:#8fd2f4;border:3px solid var(--ink)}
#fishzone{position:absolute;top:0;bottom:0;background:#79cf5b}
#fishmark{position:absolute;top:-3px;bottom:-3px;width:5px;background:var(--coral);border:1px solid var(--ink)}
#wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}
#wheel div{padding:7px 2px;text-align:center;background:var(--paper2);border:2px solid var(--ink);font:800 12.5px var(--display)}
#wheel div.on{background:var(--gold);transform:translateY(-2px)}
.wide{width:100%}
.rect{display:flex;flex-direction:column;line-height:1.2}.rect b{font:800 14px var(--display)}.rect span{display:flex;align-items:center;gap:3px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}.rect img{width:14px;height:14px}
#gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
#gifts div{padding:5px 3px;background:var(--paper2);border:2px solid var(--ink);font:700 11.5px/1.15 var(--display);text-align:center}
#gifts b{display:block;font-weight:900;font-size:12.5px}
#gifts .got{background:#b6f09d;opacity:.75}#gifts .now{background:var(--gold)}#gifts .chest{grid-column:1/-1}
#tip small{font-size:11.5px;opacity:.9}.cell.off{opacity:.55}
#lvl>div{max-width:330px}
.trayb{display:flex;gap:4px;flex:none}.trayb .btn{min-width:34px}
#tabs{flex-wrap:wrap;overflow:visible}
@media (hover:hover){#chips{scrollbar-width:thin;scrollbar-color:var(--gold) transparent}#chips::-webkit-scrollbar{display:block;height:8px}#chips::-webkit-scrollbar-thumb{background:var(--gold)}}
@media (max-width:360px){#trayt{font-size:11.5px}}
.rankme{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.rankme div{background:var(--ink);color:#fff6d6;padding:7px 3px;text-align:center;clip-path:var(--notch)}.rankme b{display:block;font:900 18px var(--display)}.rankme small{font-size:11px;opacity:.9}
.rankrow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:2px solid rgba(217,189,131,.55)}.rankrow.me{background:#ffe08a}.rankrow .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}.rankrow small{display:block;color:var(--ink2);font-weight:500}.rankrow b{font:900 15px var(--display);font-variant-numeric:tabular-nums}
.pos{width:26px;height:26px;flex:none;display:grid;place-items:center;background:var(--paper2);border:2px solid var(--ink);font:900 13px var(--display)}.pos.p1{background:#ffcf4a}.pos.p2{background:#d5d8e4}.pos.p3{background:#e0a06a}
.nhead{display:flex;gap:10px;align-items:flex-start}.nimg{width:72px;height:60px;flex:none}.nhead .t{flex:1;min-width:0}.nhead small{display:block;color:var(--ink2)}
#lvl .nimg{margin:0 auto 4px;width:108px;height:90px}.post{width:100%;max-width:256px;aspect-ratio:64/40;margin:0 auto 8px;border:3px solid var(--ink);outline:4px solid #fff;outline-offset:-1px}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.posts>*{min-width:0;padding:3px;background:#fffbea;border:2px solid var(--ink);font:800 11px/1.15 var(--display);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}.posts>button img{width:100%;aspect-ratio:64/40}.posts .off{opacity:.55;justify-content:center;min-height:68px}.posts .off img{width:22px;height:22px}
#body input[type=password]{display:block;width:100%;box-sizing:border-box;padding:8px;font:500 16px var(--body);background:#fffbea;border:3px solid var(--ink);color:var(--ink);-webkit-user-select:text;user-select:text}
</style>

<div id="app">
  <canvas id="c" aria-label="Mapa da fazenda"></canvas>
  <div id="hud">
    <button id="who" class="panel" data-a="custom" aria-label="Personalizar fazendeiro">
      <span class="av"><img class="px" id="avimg" alt=""><span id="lv"></span></span>
      <span class="inf"><div id="fname"></div><div id="xpw"><div id="xpb"></div><div id="xpt"></div></div></span>
    </button>
    <div class="panel mon"><div><span id="coins">0</span><img class="px" id="i1" alt="moedas"></div><div><span id="gems">0</span><img class="px" id="i2" alt="diamantes"></div></div>
    <button id="gear" class="panel" data-a="settings" aria-label="Ajustes"><img class="px" id="i3" alt=""></button>
  </div>
  <button id="tip" class="panel" data-a="missions"></button>
  <div id="tray" hidden><div id="trayhead"><span id="trayt"></span><span class="trayb"><button class="btn plain" data-a="chipsl" aria-label="Ver sementes anteriores">&lt;</button><button class="btn plain" data-a="chipsr" aria-label="Ver mais sementes">&gt;</button><button class="btn plain" data-a="closetool">Concluir</button></span></div><div id="chips"></div></div>
  <div id="card" class="panel" hidden></div>
  <div id="place" hidden></div>
  <nav id="dock"></nav>
  <div id="sheetw" hidden><div id="sheet" class="panel"><header><h2 id="sht"></h2><button data-a="closesheet" aria-label="Fechar">X</button></header><div id="tabs"></div><div id="body"></div></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="lvl" hidden></div>
</div>

<script>
"use strict";
/* ========== 1. DADOS DO JOGO ========== */
const CROPS={
 trigo:{n:'Trigo',seed:3,t:30,y:2,v:2,xp:1,lv:1},
 milho:{n:'Milho',seed:5,t:80,y:2,v:4,xp:2,lv:1},
 cenoura:{n:'Cenoura',seed:6,t:100,y:3,v:4,xp:3,lv:1},
 alface:{n:'Alface',seed:8,t:160,y:3,v:6,xp:4,lv:2},
 batata:{n:'Batata',seed:10,t:200,y:3,v:8,xp:5,lv:2},
 tomate:{n:'Tomate',seed:18,t:420,y:4,v:14,xp:9,lv:3},
 uva:{n:'Uva',seed:24,t:480,y:4,v:20,xp:11,lv:4},

async function apiJSON(path,init){const r=await fetch(path,{cache:'no-store',...init});let j={};try{j=await r.json()}catch(e){}return{r,j}}
function applyCloud(sv,version){G=sv;G.cloudV=version;G.fresh=0;afterLoad();lastPush=syncKey();save();closeSheet();closeTool();toast('Fazenda carregada da sua conta.')}
async function cloudPush(force){if(!acct||conflict||pushBusy||noSave)return false;const key=syncKey();if(!force&&key==lastPush)return true;pushBusy=true;try{const{r,j}=await apiJSON('/api/save',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({save:G,version:G.cloudV||0})});if(r.ok){G.cloudV=j.version;lastPush=key;save();return true}if(r.status==409){conflict=true;askConflict();return false}if(r.status==401){acct=null}return false}catch(e){return false}finally{pushBusy=false}}
function choiceModal(title,text,a,b){const el=$('#lvl');el.hidden=false;el.innerHTML=`<div class="panel"><h2 style="font-size:24px">${title}</h2><p>${text}</p><div class="acts" style="justify-content:center">${a}${b}</div></div>`}
async function askConflict(){const{j}=await apiJSON('/api/save');window.__cloud=j;choiceModal('Sua fazenda mudou','Ela foi salva em outro aparelho depois da última vez que você jogou aqui. Vamos carregar a versão mais nova.','','<button class="btn green" data-a="cloudtake">Carregar fazenda</button>')}
async function cloudPull(){const{r,j}=await apiJSON('/api/save');if(!r.ok)return;if(!j.save){await cloudPush(true);return}if(G.cloudV===j.version){lastPush='';return}if(G.cloudV!=null||localNew()){applyCloud(j.save,j.version);return}window.__cloud=j;choiceModal('Qual fazenda você quer?',`Sua conta tem uma fazenda no <b>nível ${j.save.lvl}</b>, com ${Number(j.save.coins||0).toLocaleString('pt-BR')} moedas. Este aparelho tem outra no <b>nível ${G.lvl}</b>, com ${G.coins.toLocaleString('pt-BR')} moedas. A que você não escolher será substituída.`,'<button class="btn plain" data-a="cloudkeep">Usar a deste aparelho</button>','<button class="btn green" data-a="cloudtake">Usar a da conta</button>')}
async function accountInit(){try{const c=await apiJSON('/api/config');if(!c.r.ok||!c.j.auth)return;acctOn=true;const m=await apiJSON('/api/auth/me');acct=m.j.user;if(sheet=='settings')renderSheet();if(acct){await cloudPull();setInterval(()=>{if(!document.hidden)cloudPush()},30000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&acct&&!conflict&&!noSave){const b=JSON.stringify({save:G,version:G.cloudV||0});if(b.length<60000&&syncKey()!=lastPush)try{fetch('/api/save',{method:'PUT',keepalive:true,headers:{'content-type':'application/json'},body:b}).then(r=>r.json()).then(j=>{if(j.version){G.cloudV=j.version;lastPush=syncKey();save()}}).catch(()=>{})}catch(e){}}else if(!document.hidden&&acct)apiJSON('/api/save').then(({r,j})=>{if(r.ok&&j.version!==G.cloudV&&G.cloudV!=null)askConflict()}).catch(()=>{})})}else if(G.lvl>=2)toast('Crie uma conta em Ajustes para não perder sua fazenda.')}catch(e){}}

function update(dt){
 const dx=farmer.tx-farmer.x,dy=farmer.ty-farmer.y,dist=Math.hypot(dx,dy),sp=11*dt;farmer.moving=dist>.05;
 if(dist>sp){farmer.x+=dx/dist*sp;farmer.y+=dy/dist*sp;const scr=dx-dy;if(Math.abs(scr)>.01)farmer.face=scr>0?1:-1}else{farmer.x=farmer.tx;farmer.y=farmer.ty}
 if(farmer.act>0&&!farmer.moving)farmer.act-=dt;farmer.t+=dt;
 for(const e of ents){if(e.bee)continue;e.t+=dt;e.hop=Math.max(0,e.hop-dt*3);if(e.eat>0){e.eat-=dt;e.tu=.8;e.tv=.15+(e.i%3)*.1;}
  e.w-=dt;if(e.w<=0&&e.eat<=0){e.w=1.5+Math.random()*4;let a,b,tries=0;do{a=.1+Math.random()*.8;b=.1+Math.random()*.8}while(a+b<1.15&&tries++<20);e.tu=a;e.tv=b}
  const du=e.tu-e.u,dv=e.tv-e.v,d=Math.hypot(du,dv),s=.1*dt;e.mov=d>.02;if(e.mov){e.u+=du/d*s;e.v+=dv/d*s;const[w,h]=fp(e.b),scr=du*w-dv*h;if(Math.abs(scr)>.001)e.face=scr>0?-1:1;e.f=(e.t*5|0)%2}}
 for(const p of parts){p.t+=dt;if(!p.fly){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt}}parts=parts.filter(p=>p.t<p.life);

 case'bfastan':{const t=now(),k=bb.animals.filter(x=>x.e>t).sort((p,q)=>p.e-q.e)[0];if(k)accel(gemCost(k.e-t),()=>{k.e=now()});break}
 case'bfastf':{const d=bb.queue[0].e-now();accel(gemCost(d),()=>bb.queue.forEach(q=>q.e-=d));break}
 case'bqueue':enqueue(bb,+v);break;case'bcollectf':collectFactory(bb);break;case'bup':upgrade(bb);break;
 case'bmove':{const b=bb;closeCard();startPlace(b.t,b);break}
 case'brm':G.builds=G.builds.filter(x=>x!=bb);rebuildOcc();dirty=true;closeCard();break;
 case'buyan':{const b=G.builds.find(x=>x.id==v);buyAnimal(b);renderSheet();break}
 case'seedb':{const[c_,n]=v.split(':');buySeeds(c_,+n);renderSheet();break}
 case'sell':{const[i,n]=v.split(':');sell(i,n=='all'?1e9:+n);renderSheet();break}
 case'redeem':{const r=redeem($('#promo').value),m=$('#promomsg');m.textContent=r.m;m.style.color=r.ok?'var(--leaf2)':'var(--coral)';if(r.ok){$('#promo').value='';sfx('level');coinBurst(10);const k=subTab;ui();subTab=k;const nm=$('#promomsg');if(nm){nm.textContent=r.m;nm.style.color='var(--leaf2)'}}else sfx('no');break}
 case'buypack':buyPack(v,el);break;
 case'buyi':buyItem(v,1);renderSheet();break;
 case'gemc':if(G.gems>0){G.gems--;G.coins+=80*G.lvl;sfx('coin');ui();renderSheet()}break;
 case'gemboost':if(G.gems>=5){G.gems-=5;G.boost=Math.max(G.boost||0,now())+36e5;sfx('level');toast('Adubo ativo: plantas novas crescem 2x mais rápido.');ui();renderSheet()}break;
 case'gemall':{const c=allCost();if(c&&G.gems>=c){G.gems-=c;const t=now();for(const i in G.crops){const q=G.crops[i];if(q.p+q.d>t)q.p=t-q.d}sfx('level');toast('Todas as plantas ficaram prontas!');ui();renderSheet()}break}
 case'gemcap':if(G.gems>=15){G.gems-=15;G.capX=(G.capX||0)+50;sfx('level');toast('Seu celeiro ganhou 50 de espaço.');ui();renderSheet()}break;
 case'gosell':openSheet('shop','sell');break;
 case'claim':claimStory();break;case'deliver':deliver(+v);break;case'swaporder':G.orders.splice(+v,1,genOrder());renderSheet();ui();break;
 case'expandb':expand();break;case'expandg':expand(true);break;
 case'fopt':{const[k,val]=v.split(':');G.farmer[k]=k=='g'?+val:val;$('#avimg').src=personURL(G.farmer);const inp=$('#farm');if(inp)G.name=inp.value||G.name;renderSheet();break}
 case'setopt':{const[k,val]=v.split(':');G[k]=+val;if(k=='music'&&+val)startMusic();renderSheet();break}
 case'exp':{const t=btoa(unescape(encodeURIComponent(JSON.stringify(G))));const b=$('#savebox');b.value=t;b.select();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Código copiado.')).catch(()=>toast('Selecione o texto e copie.'));else toast('Selecione o texto e copie.');break}
 case'imp':{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#savebox').value.trim()))));if(!d.builds||!d.ground)throw 0;{const cv=G.cloudV;G=d;G.cloudV=cv}afterLoad();closeSheet();toast('Fazenda restaurada.')}catch(x){toast('Esse código não é válido. Cole o código inteiro.')}break}
 case'reset1':$('#resetw').innerHTML='<span style="align-self:center">Apagar tudo mesmo?</span><button class="btn plain" data-a="closesheet">Não</button><button class="btn red" data-a="reset2">Sim, apagar</button>';break;
 case'reset2':{const cv=G.cloudV;Store.clear();G=newGame();G.cloudV=cv}afterLoad();closeSheet();openSheet('custom');break;
 case'lvlok':$('#lvl').hidden=true;break;
 }
 save()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='promo'){e.preventDefault();$('[data-a=redeem]').click()}});
document.addEventListener('input',e=>{if(e.target.id=='nimboname'){G.nimbo.name=e.target.value.slice(0,14)}if(e.target.id=='farm'){G.name=e.target.value.slice(0,24)||'Fazenda dos Sonhos';$('#fname').textContent=G.name}});

/* Com mouse, a lista também desliza com a roda ou arrastando. */
(()=>{const el=$('#chips');let d=null,moved=false;
 el.addEventListener('wheel',e=>{if(el.scrollWidth>el.clientWidth){e.preventDefault();el.scrollLeft+=e.deltaY+e.deltaX}},{passive:false});
 el.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'){d={x:e.clientX,l:el.scrollLeft};moved=false}});
 addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>5)moved=true;if(moved)el.scrollLeft=d.l-dx});
 addEventListener('pointerup',()=>{d=null});
 el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true)})();
/* ========== 9. ÁUDIO SINTETIZADO ========== */
let AC=null,musicT=0;
function unlockAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(G&&G.music)startMusic()}if(AC&&AC.state=='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type='sine',v=.12,when=0,slide=0){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function sfx(n){if(quiet||!G||!G.sfx||!AC)return;switch(n){
 case'tap':tone(520,.05,'square',.03);break;case'no':tone(160,.14,'square',.06);break;
 case'mow':tone(95,.09,'sawtooth',.045,0,25);break;
 case'dig':tone(120,.09,'triangle',.16,0,-50);break;case'plant':tone(420,.08,'triangle',.09,0,180);break;case'water':tone(800,.12,'sine',.05,0,-400);break;
 case'harvest':tone(660,.07,'triangle',.1);tone(990,.09,'triangle',.08,.05);break;case'coin':tone(990,.06,'square',.05);tone(1320,.12,'square',.05,.06);break;
 case'build':tone(140,.12,'square',.09);tone(200,.1,'square',.08,.14);tone(300,.14,'square',.06,.28);break;
 case'level':[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.11,i*.09));break;
 case'galinha':tone(800,.05,'square',.04,0,300);tone(900,.06,'square',.04,.08,-200);break;case'vaca':tone(170,.5,'sawtooth',.06,0,-50);break;case'pato':tone(420,.08,'sawtooth',.05,0,-150);tone(420,.08,'sawtooth',.05,.12,-150);break;
 case'porco':tone(240,.16,'sawtooth',.05,0,120);break;case'ovelha':tone(340,.32,'sawtooth',.04,0,-40);break;case'cabra':tone(460,.25,'sawtooth',.04,0,-90);break;case'abelha':tone(220,.3,'sawtooth',.018);break}}
const SCALE=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];let mi=3;
function startMusic(){if(musicT||!AC)return;const go=()=>{if(!G.music||!AC){musicT=0;return}mi=Math.max(0,Math.min(7,mi+(Math.random()*5|0)-2));tone(SCALE[mi],1.1,'sine',.035);if(Math.random()<.35)tone(SCALE[mi]/2,1.6,'triangle',.02);musicT=setTimeout(go,500+Math.random()*800)};go()}

/* ========== 10. INÍCIO, RETORNO E LOOP ========== */
function welcomeBack(){const away=(now()-G.last)/1000;if(away<60)return;let ripe=0,ready=0;for(const i in G.crops){const cr=G.crops[i];if(now()>=cr.p+cr.d&&cr.p+cr.d>G.last)ripe++}G.builds.forEach(b=>{if(b.animals)b.animals.forEach(a=>{if(a.e&&a.e<=now()&&a.e>G.last)ready++});if(b.queue)b.queue.forEach(q=>{if(q.e<=now()&&q.e>G.last)ready++})});if(ripe||ready)toast(`Enquanto você esteve fora: ${ripe?ripe+' planta'+(ripe>1?'s':'')+' pronta'+(ripe>1?'s':''):''}${ripe&&ready?' e ':''}${ready?ready+' produto'+(ready>1?'s':''):''}.`)}
function afterLoad(){if(typeof G.ground=='string')G.ground=G.ground.split('').map(Number);G.redeemed=G.redeemed||[];G.paidOrders=G.paidOrders||[];G.pid=G.pid||newPid();ensureNimbo();G.weeds=G.weeds||[];G.weedT=G.weedT||now()+3e4;ensureDaily();fishEnergy();migrateMap(G);rebuildOcc();[[22,22],[25,22],[22,25],[25,25]].forEach(([a,b])=>{const x=a+OFF,y=b+OFF,i=idx(x,y);if(G.ground[i]==SHORE&&!occ[i])G.ground[i]=WATER});syncAnimals();fillOrders();buildTerrain();$('#avimg').src=personURL(G.farmer);ents=[];syncAnimals();closeCard();ui();updTip();const[x,y]=[CX,CX];cam.x=wx(x,y);cam.y=wy(x,y)-10}
function boot(){buildTiles();$('#i1').src=icon('coin');$('#i2').src=icon('gem');$('#i3').src=icon('gear');buildDock();
 const s=Store.load();G=(s&&s.builds&&s.ground)?s:newGame();resize();
 cam.z=Math.min(zMax(),Math.max(zMin(),Math.min(W/(30*32)*2.15,2.2*DPR)));
 afterLoad();if(s)welcomeBack();if(G.fresh)openSheet('custom');
 addEventListener('resize',()=>{resize()});setInterval(save,5000);setInterval(()=>{if(cardFn&&(selB||selTile))renderCardIfOpen();ui2()},1000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else welcomeBack()});addEventListener('pagehide',save);
 payInit();rankInit();accountInit();if(s&&!G.fresh)setTimeout(showGift,700);
 requestAnimationFrame(loop)}
function loop(ts){const dt=Math.min(.25,(ts-lastT)/1000||0);lastT=ts;acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}render(ts);requestAnimationFrame(loop)}
window.FDS={cloudPush,get acct(){return acct},claimTrip,startTrip,nimboStage,CARDS,cardURL,get crew(){return crew},rankTotal,expand,unlocked,N,OFF,rankSync,rankTotal,mowAt,grassTall,nearGoal,claimGift,showGift,ALBUM,fertCap,fertUsed,free,cleanAt,spawnPest,startFish,reel,fishEnergy,get fishing(){return fishing},fertCrop,waterCrop,allCost,gemCost,checkPay,get G(){return G},harvest,till,plantCrop,sell,buySeeds,save,tileAt,cam,storageCap,storageUsed,wx,wy,get W(){return W},get H(){return H},get DPR(){return DPR}};
boot();
